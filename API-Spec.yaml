x-api-design-notes:
  versioning: |
    API uses URL path versioning (v1, v2, etc.) for major breaking changes.
    Minor updates and new optional fields are added without version changes.
    
  authentication: |
    Primary authentication via Google OAuth 2.0 with JWT tokens for API access.
    Refresh tokens are used for long-lived sessions.
    
  rate-limiting: |
    Rate limits are enforced per user account and tied to subscription plans.
    Rate limit headers are included in responses (X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Reset).
    
  pagination: |
    List endpoints use offset-based pagination with configurable limits.
    Future consideration for cursor-based pagination for better performance.
    
  soft-deletes: |
    Resources are soft-deleted by default with a deleted_at timestamp.
    Hard deletion is admin-only for compliance purposes.
    
  validation: |
    Input validation follows JSON Schema standards.
    Business rule validation (e.g., rate limits) returns appropriate error codes.
    
  caching: |
    GET endpoints include appropriate cache headers.
    PDF generation results are cached for 24 hours.
    
  monitoring: |
    All endpoints include request tracing and performance monitoring.
    Error rates and response times are tracked per endpoint.

